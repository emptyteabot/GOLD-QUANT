# Pytest配置文件

[tool:pytest]
# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 输出选项
addopts =
    -v                          # 详细输出
    --tb=short                  # 简短的traceback
    --strict-markers            # 严格标记模式
    --disable-warnings          # 禁用警告
    -p no:cacheprovider         # 禁用缓存
    --cov=.                     # 代码覆盖率
    --cov-report=html           # HTML覆盖率报告
    --cov-report=term-missing   # 终端显示缺失覆盖
    --cov-config=.coveragerc    # 覆盖率配置

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    security: 安全测试
    slow: 慢速测试
    asyncio: 异步测试

# 异步测试配置
asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 超时设置（秒）
timeout = 300

# 并行测试
# 需要安装 pytest-xdist
# addopts = -n auto
