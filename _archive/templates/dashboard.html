<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金量化交易系统 - 控制面板</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151932;
            --bg-card: #1a1f3a;
            --accent-gold: #f7931a;
            --accent-green: #00d4aa;
            --accent-red: #ff4757;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --border: #2d3250;
        }
        
        body {
            font-family: 'Noto Sans SC', 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1428 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .status-badge {
            padding: 8px 20px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-badge.running {
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        
        .status-badge.stopped {
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
        
        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .controls {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-green), #00b894);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 170, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #ee5a6f);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 71, 87, 0.3);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-4px);
        }
        
        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card-value {
            font-size: 36px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 8px;
        }
        
        .card-change {
            font-size: 14px;
            font-weight: 600;
        }
        
        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }
        
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        
        .signals-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .signal-item {
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-gold);
        }
        
        .signal-item.buy {
            border-left-color: var(--accent-green);
        }
        
        .signal-item.sell {
            border-left-color: var(--accent-red);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-gold);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>⚡ 黄金量化交易系统</h1>
                <div class="status-badge" id="statusBadge">
                    <span class="pulse"></span>
                    <span id="statusText">已停止</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-primary" id="startBtn" onclick="startSystem()">🚀 启动系统</button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopSystem()" disabled>⏹️ 停止系统</button>
            </div>
        </header>
        
        <div class="dashboard">
            <div class="card">
                <div class="card-title">当前价格</div>
                <div class="card-value" id="currentPrice">$0.00</div>
                <div class="card-change" id="priceChange">--</div>
            </div>
            
            <div class="card">
                <div class="card-title">账户余额</div>
                <div class="card-value" id="balance">$100,000</div>
                <div class="card-change" id="balanceChange">--</div>
            </div>
            
            <div class="card">
                <div class="card-title">总收益率</div>
                <div class="card-value" id="totalReturn">0.00%</div>
                <div class="card-change" id="returnChange">--</div>
            </div>
            
            <div class="card">
                <div class="card-title">胜率</div>
                <div class="card-value" id="winRate">0%</div>
                <div class="card-change" id="totalTrades">0 笔交易</div>
            </div>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">📈 实时价格走势</div>
            <canvas id="priceChart"></canvas>
        </div>
        
        <div class="signals-list">
            <div class="chart-title">📊 交易信号</div>
            <div id="signalsList">
                <p style="color: var(--text-secondary); text-align: center; padding: 40px;">暂无信号</p>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let priceChart;
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '黄金价格',
                        data: [],
                        borderColor: '#f7931a',
                        backgroundColor: 'rgba(247, 147, 26, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: '#2d3250' },
                            ticks: { color: '#9aa0a6' }
                        },
                        x: {
                            grid: { color: '#2d3250' },
                            ticks: { color: '#9aa0a6' }
                        }
                    }
                }
            });
        }
        
        // WebSocket事件
        socket.on('connect', () => {
            console.log('✅ 已连接到服务器');
        });
        
        socket.on('price_update', (data) => {
            updatePrice(data.price);
            updateChart(data.time, data.price);
        });
        
        socket.on('signal_update', (signal) => {
            addSignal(signal);
        });
        
        // 更新价格
        function updatePrice(price) {
            document.getElementById('currentPrice').textContent = `$${price.toFixed(2)}`;
        }
        
        // 更新图表
        function updateChart(time, price) {
            const label = new Date(time).toLocaleTimeString();
            priceChart.data.labels.push(label);
            priceChart.data.datasets[0].data.push(price);
            
            if (priceChart.data.labels.length > 50) {
                priceChart.data.labels.shift();
                priceChart.data.datasets[0].data.shift();
            }
            
            priceChart.update('none');
        }
        
        // 添加信号
        function addSignal(signal) {
            const signalsList = document.getElementById('signalsList');
            const signalItem = document.createElement('div');
            signalItem.className = `signal-item ${signal.type}`;
            signalItem.innerHTML = `
                <div>
                    <strong>${signal.type === 'buy' ? '📈 买入' : '📉 卖出'}</strong>
                    <div style="color: var(--text-secondary); font-size: 12px;">${new Date(signal.time).toLocaleString()}</div>
                </div>
                <div style="text-align: right;">
                    <div>$${signal.price.toFixed(2)}</div>
                    <div style="color: var(--text-secondary); font-size: 12px;">置信度: ${(signal.confidence * 100).toFixed(0)}%</div>
                </div>
            `;
            signalsList.insertBefore(signalItem, signalsList.firstChild);
        }
        
        // 启动系统
        async function startSystem() {
            const response = await fetch('/api/start', { method: 'POST' });
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('statusBadge').className = 'status-badge running';
                document.getElementById('statusText').textContent = '运行中';
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
            }
        }
        
        // 停止系统
        async function stopSystem() {
            const response = await fetch('/api/stop', { method: 'POST' });
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('statusBadge').className = 'status-badge stopped';
                document.getElementById('statusText').textContent = '已停止';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        // 定期更新状态
        setInterval(async () => {
            const response = await fetch('/api/status');
            const data = await response.json();
            
            document.getElementById('balance').textContent = `$${data.balance.toLocaleString()}`;
            document.getElementById('totalReturn').textContent = `${data.return.toFixed(2)}%`;
            document.getElementById('winRate').textContent = data.total_trades > 0 
                ? `${((data.win_trades / data.total_trades) * 100).toFixed(0)}%` 
                : '0%';
            document.getElementById('totalTrades').textContent = `${data.total_trades} 笔交易`;
        }, 2000);
        
        // 初始化
        initChart();
    </script>
</body>
</html>
