# Gold Advisor Pro™ 云端授权配置
# 部署到 Streamlit Cloud 后在 App Settings > Secrets 中填写

# 方式1：设置 master_key（万能授权码）
# master_key = "GAP-XXXX-XXXX-XXXX-XXXX"

# 方式2：设置多个客户授权码
# [license_keys]
# customer1 = "GAP-AAAA-BBBB-CCCC-DDDD"
# customer2 = "GAP-EEEE-FFFF-GGGG-HHHH"

# 方式3：跳过授权（全部开放，用于演示）
# 在 Streamlit Cloud 环境变量中设置:
# AUTO_ACTIVATE = "1"
# DEFAULT_TIER = "PRO"



